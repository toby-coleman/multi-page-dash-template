[project]
name = "multi-page-dash-template"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dash>=4.0",
    "dash-bootstrap-components>=2.0",
    "flask-jwt-extended>=4.7",
    "plotly>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I"]
